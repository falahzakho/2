<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rennale Renuelly - Mobile View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #12281e;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* پێشگیریا سکڕۆلکرنێ دکەت دا ل سەر شاشا موبایلێ ب ته‌مامه‌تی دیار بیت */
        }

        .mobile-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
        }

        .mobile-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* وێنەی ب ته‌مامه‌تی دگەل قەبارێ شاشا موبایلێ گونج ددەت */
            display: block;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <img src="https://i.postimg.cc/SNfC63jw/3rd-Example-of-Good-Web-Design.jpg" alt="Rennale Renuelly Mobile View">
    </div>

</body>
</html>
